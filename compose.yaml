# The full stack: nginx serves the web app on http://localhost:8080 and proxies /api to NestJS.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PORT: "3000"
      # nginx in the web container is the one proxy in front of the API.
      TRUST_PROXY_HOPS: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      # Local use only; a deployment puts a load balancer in front instead.
      - "127.0.0.1:8080:8080"
    read_only: true
    # nginx writes its pid and temp files to /tmp, and its rendered config to conf.d.
    tmpfs: ["/tmp:mode=1777", "/etc/nginx/conf.d:mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
